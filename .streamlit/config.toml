[theme]
base = "dark"
primaryColor = "#22d3ee"
backgroundColor = "#0b1120"
secondaryBackgroundColor = "#111a2e"
textColor = "#e2e8f0"
font = "sans serif"

[server]
# Security: listen on this computer only. By default Streamlit listens on every
# network interface, which exposes the app (and its history) to the local network.
# To demo from another device on a trusted network, run:
#   streamlit run app.py --server.address 0.0.0.0
address = "localhost"
# Upload limit in MB (the app enforces a stricter per-file limit itself)
maxUploadSize = 1
maxMessageSize = 50
runOnSave = false
# Explicit (these are Streamlit's secure defaults; keep them enabled)
enableXsrfProtection = true
enableCORS = true

[browser]
# Privacy: do not send usage statistics
gatherUsageStats = false

[client]
toolbarMode = "minimal"
