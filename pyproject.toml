[project]
name = "phishguard-ai"
version = "1.0.0"
description = "PhishGuard AI — intelligent phishing email and URL analysis platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the normal idiom in pytest
"tests/**" = ["S101"]
